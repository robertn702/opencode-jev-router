name: Publish npm package

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11
      - name: Check tag matches package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - name: Pack release artifact
        run: echo "TARBALL=$RUNNER_TEMP/$(npm --silent pack --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Smoke-test release artifact
        run: npm run smoke:package -- "$TARBALL"
      - name: Check previously published artifact
        id: existing
        run: |
          PACKAGE_URL=$(node -p "const p = require('./package.json'); 'https://registry.npmjs.org/' + encodeURIComponent(p.name) + '/' + p.version")
          if curl --fail --silent --show-error --output "$RUNNER_TEMP/published.json" "$PACKAGE_URL" 2>/dev/null; then
            node -e "const fs = require('node:fs'); const crypto = require('node:crypto'); const expected = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/published.json', 'utf8')).dist.shasum; const actual = crypto.createHash('sha1').update(fs.readFileSync(process.env.TARBALL)).digest('hex'); if (expected !== actual) { console.error('Published tarball differs from tagged commit'); process.exit(1); }"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.already_published != 'true'
        run: npm publish --dry-run "$TARBALL"
      - if: steps.existing.outputs.already_published != 'true'
        run: npm publish --provenance --access public "$TARBALL"
