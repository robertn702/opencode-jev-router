name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke:package

  plugin-smoke:
    name: plugin smoke (OpenCode ${{ matrix.opencode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode: ['1.18.32', '2.0.18']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: mkdir -p /tmp/opencode
      - name: V1 smoke
        if: startsWith(matrix.opencode, '1.')
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund "opencode-ai@${{ matrix.opencode }}"
          npm run build
          OPENCODE_BIN="$RUNNER_TEMP/opencode/node_modules/.bin/opencode" npm run smoke:plugin
      - name: V2 smoke
        if: startsWith(matrix.opencode, '2.')
        run: npm run smoke:plugin:v2
