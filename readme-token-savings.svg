<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" role="img" aria-labelledby="title description">
  <title id="title">GPT-6 Astra with Jev routing: 42 percent fewer output tokens on a replicated task</title>
  <desc id="description">On pytest 5262, six attempts per arm, Jev averaged 1,112 output tokens versus 1,908 with high reasoning, 42 percent fewer. Both solved six of six; Jev also took about 40 percent less time. Separately, on a selected hard case, Jev solved five of five attempts versus one of five with medium reasoning. Across the 44-attempt per arm evaluation, Jev and high reasoning each solved 44 of 44, and Jev used 14 percent fewer output tokens on average. Selected examples do not imply a general reliability advantage.</desc>
  <rect width="900" height="432" rx="16" fill="#f8fafc"/>
  <rect x="0" y="0" width="9" height="432" rx="4" fill="#0d9488"/>
  <text x="35" y="42" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#0f766e">GPT-6 ASTRA  /  CODING AGENT EVAL</text>
  <text x="35" y="90" font-family="system-ui,sans-serif" font-size="32" font-weight="750" fill="#0f172a">Reasoning when it counts.</text>
  <text x="35" y="120" font-family="system-ui,sans-serif" font-size="16" fill="#475569">One router, different levels of effort for different steps.</text>

  <text x="35" y="207" font-family="system-ui,sans-serif" font-size="76" font-weight="780" fill="#0f766e">42%</text>
  <text x="35" y="237" font-family="system-ui,sans-serif" font-size="21" font-weight="650" fill="#0f172a">fewer output tokens</text>
  <text x="35" y="265" font-family="system-ui,sans-serif" font-size="14" fill="#475569">pytest #5262 · six runs per arm</text>
  <text x="35" y="287" font-family="system-ui,sans-serif" font-size="14" fill="#475569">Both approaches solved 6/6.</text>

  <text x="418" y="166" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#0f172a">Output tokens per attempt</text>
  <text x="418" y="197" font-family="system-ui,sans-serif" font-size="13" fill="#475569">High reasoning</text>
  <rect x="418" y="208" width="360" height="18" rx="5" fill="#94a3b8"/>
  <text x="790" y="222" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#334155">1,908</text>
  <text x="418" y="257" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Jev router</text>
  <rect x="418" y="268" width="210" height="18" rx="5" fill="#0d9488"/>
  <text x="640" y="282" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#0f766e">1,112</text>
  <text x="418" y="314" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#0f766e">Also ~40% less time on this task</text>

  <path d="M35 340H865" stroke="#cbd5e1"/>
  <text x="35" y="367" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#0f172a">A separate selected hard case:</text>
  <text x="248" y="367" font-family="system-ui,sans-serif" font-size="14" fill="#334155">Jev solved 5/5 vs 1/5 with medium reasoning.</text>
  <text x="35" y="394" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Overall: Jev and high reasoning each solved 44/44; Jev used 14% fewer output tokens.</text>
  <text x="35" y="415" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Output includes reasoning · selected hard-case result is exploratory, not a general reliability claim</text>
</svg>
